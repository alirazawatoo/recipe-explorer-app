server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles never change, so they can be cached for a long time.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /recipes/12 are served by index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
